[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pingme-cli"
version = "1.0.0"
description = "Terminal to iPhone messaging CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "prompt_toolkit>=3.0.0",
    "websockets>=12.0.0",
]

[project.scripts]
pingme = "pingme.cli:cli"
